:root{
  --bg:#02090e;
  --surface:#04141c;
  --surface-2:#06202c;
  --ink:#d9f4ef;
  --muted:#7fa8a3;
  --line:#0f3a46;
  --accent:#39e6c3;
  --accent-2:#ffb454;
  --danger:#ff6b6b;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#01060a;
    --surface:#03121a;
    --surface-2:#051e2a;
    --ink:#d9f4ef;
    --muted:#7fa8a3;
    --line:#0d3442;
    --accent:#39e6c3;
    --accent-2:#ffb454;
    --danger:#ff6b6b;
  }
}
html{
  scroll-behavior:smooth
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
}
.font-display{
  font-family:"Instrument Serif", Georgia, serif;
}
.font-data{
  font-family:"JetBrains Mono", ui-monospace, Menlo, monospace;
}

}
.hover\:bg-\[var\(--accent-2\)\]:hover {
  background-color: var(--accent-2);
}
.focus\:outline-none:focus {
  outline: 2px solid transparent;

}
.focus\:ring-2:focus {

}
.focus\:ring-\[var\(--accent\)\]:focus {
  --tw-ring-color: var(--accent);
}
.focus\:ring-\[var\(--accent-2\)\]:focus {
  --tw-ring-color: var(--accent-2);
}
@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:gap-3 {
    gap: 0.75rem;
  }
  .sm\:p-4 {
    padding: 1rem;
  }
  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:text-\[15px\] {
    font-size: 15px;
  }
  .sm\:text-\[32px\] {
    font-size: 32px;
  }
}
@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .lg\:min-h-\[640px\] {
    min-height: 640px;
  }
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_360px\] {
    grid-template-columns: minmax(0,1fr) 360px;
  }
  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_380px\] {
    grid-template-columns: minmax(0,1fr) 380px;
  }
}
@media (min-width: 1280px) {
  .xl\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
